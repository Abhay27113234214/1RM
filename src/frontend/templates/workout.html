    <header class="bar">
        <div class="bar-in">
            <a class="logo" href="home.html"><span class="mark">✱</span>1RM</a>
            <div class="bar-date" id="barDate">session</div>
            <div class="bar-acts">
                <button class="icon-btn" id="restBtn" aria-label="Rest timer">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <circle cx="12" cy="13" r="8" />
                        <path d="M12 9.5v3.5l2.4 2.4" />
                        <path d="M9.5 2h5" />
                    </svg>
                </button>
                <button class="finish-btn" id="finishBtn">Finish ✱</button>
            </div>
        </div>
    </header>

        <!-- session strip -->
        <div class="sess-strip">

            <div class="ss"><span class="ss-v" id="ssCount">0</span><span class="ss-l">exercises</span></div>
            <div class="ss"><span class="ss-v"><b id="ssVol" style="font-weight:600">0</b><i> kg</i></span><span

        </div>

        </div>

        <!-- add exercise — dismissible dialog + create-your-own -->
        <div class="add-ex" id="addEx">
            <button class="add-ex-btn" id="addExBtn">+ Add exercise ✱</button>
            <div class="add-ex-box" id="addExBox" hidden>
                <div class="add-ex-head">
                    <span class="add-ex-lbl">add exercise</span>
                    <button class="add-ex-x" id="addExClose" aria-label="Close">✕</button>
                </div>
                <input id="exSearch" type="text" placeholder="Search 1,240 exercises…">
                <div class="sugg" id="suggList"></div>
                <!-- TODO: point this at your exercise-creation page -->
                <a class="create-ex" id="createExBtn" href="create-exercise.html">
                    <span class="ce-star">✱</span>
                    <span>Can't find it? <em>create your own</em></span>
                    <span class="arr">→</span>
                </a>
            </div>
        </div>

    </main>

    <!-- ═══════════ rest timer dock ═══════════ -->
    <div class="rest-dock" id="restDock" hidden>
        <div class="rd-card">
            <div class="rd-pick" id="rdPick">
                <div class="rd-head">
                    <span class="rd-lbl">Rest timer</span>
                    <button class="rd-x" id="rdClose" aria-label="Close">✕</button>
                </div>
                <div class="rd-chips">
                    <button class="rd-chip" data-rest="45">0:45</button>
                    <button class="rd-chip on" data-rest="90">1:30</button>
                    <button class="rd-chip" data-rest="120">2:00</button>
                    <button class="rd-chip" data-rest="180">3:00</button>
                </div>
                <button class="rd-start" id="rdStart">Start rest <span class="arr">→</span></button>
            </div>
            <div class="rd-live" id="rdLive" hidden>
                <div class="rd-time" id="rdTime">1:30</div>
                <div class="rd-mid">
                    <div class="rd-sub" id="rdSub">breathe ✱ reset</div>
                    <div class="rd-bar"><i id="rdBar"></i></div>
                </div>
                <div class="rd-acts">
                    <button class="rd-btn" id="rdAdd">+15s</button>
                    <button class="rd-btn rd-skip" id="rdSkip">Skip</button>
                </div>
            </div>
            <div class="rd-done" id="rdDone" hidden>
                <div class="rd-done-t">Time to lift <em>✱</em></div>
                <div class="rd-sub">back under the bar</div>
            </div>
        </div>
    </div>

    <!-- ═══════════ finish dialog: title / description / photos ═══════════ -->
<div class="modal" id="finishModal" aria-hidden="true">
  <div class="modal-back" data-close></div>
  <div class="modal-panel">
    <button class="modal-x" data-close aria-label="Close">✕</button>
    <div class="modal-card">
      <div class="step-lbl">wrap it up</div>
      <h3 class="fm-title">Name <em>this one.</em></h3>
      <p class="fm-sub">A title, a few words, photos if you want — then it goes in the ledger.</p>
      <div class="fm-stats" id="fmStats"></div>

      <div class="fm-field">
        <label for="fmTitle">Title</label>
        <input id="fmTitle" type="text" maxlength="60" placeholder="Leg day — everything heavy.">
      </div>

      <div class="fm-field">
        <label for="fmDesc">Description · optional</label>
        <textarea id="fmDesc" rows="3" maxlength="280" placeholder="How did it feel? Worth remembering?"></textarea>
      </div>

      <div class="fm-field">
        <label>Photos · optional</label>
        <div class="fm-shots" id="fmShots">
          <label class="fm-add" for="fmPhotos">+<span>add photo</span></label>
        </div>
        <input id="fmPhotos" type="file" accept="image/*" multiple hidden>
      </div>

      <div class="fm-row">
        <button class="fm-skip" id="fmSkip">Skip — save as is</button>
        <button class="fm-save" id="fmSave">Save workout <span class="arr">→</span></button>
      </div>
    </div>
  </div>
</div>

    <!-- ═══════════ exercise template — for your JS ═══════════ -->
    <template id="exTpl">
        <article class="ex-card">
            <div class="ex-head">
                <span class="ex-dot"></span>
                <h3 class="ex-name" data-bind="name"></h3>
                <span class="ex-eq" data-bind="eq"></span>
                <button class="ex-del" data-del aria-label="Remove exercise">✕</button>
            </div>
            <div class="ex-last" data-bind="last"></div>
            <div class="sets"></div>
            <div class="ex-foot">
                <button class="add-set" data-addset>+ add set</button>
                <button class="note-btn" data-note>✱ add note</button>
            </div>
            <div class="note-box">
                <div><textarea placeholder="How did it feel? Tempo, cues, anything worth remembering…"></textarea></div>
            </div>
        </article>
    </template>

    <div id="toastZone" class="toast-zone" aria-live="polite"></div>

</body>

</html>
